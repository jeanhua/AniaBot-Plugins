name: validate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'plugins/**'
      - 'index.json'
      - 'scripts/**'
      - '.github/workflows/validate.yaml'
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出插件仓库
        uses: actions/checkout@v4
        with:
          path: plugins-repo

      - name: 检出 AniaBot 源码（编译校验用）
        uses: actions/checkout@v4
        with:
          repository: jeanhua/AniaBot
          path: aniabot

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: aniabot/go.sum

      # 合并到 main 后自动重新生成并提交 index.json：
      # 提交者无需手动维护插件索引，合并后由这里自动同步。
      # 该提交只改 index.json，不在 push 触发路径内，不会造成死循环。
      - name: 自动同步 index.json（main push / 手动触发）
        if: github.event_name != 'pull_request'
        working-directory: plugins-repo
        run: |
          bash scripts/build-index.sh
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "chore: 自动同步 index.json（插件索引）"
            git push
            echo "已自动提交更新后的 index.json"
          else
            echo "index.json 已是最新，无需更新"
          fi

      - name: 校验插件并编译（PR 允许索引差异，由 main 自动同步）
        working-directory: plugins-repo
        env:
          ANIA_SRC: ${{ github.workspace }}/aniabot
          ALLOW_INDEX_DIFF: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: bash scripts/validate.sh
